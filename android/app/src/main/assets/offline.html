<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect GOD - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, #fff1f2 0%, #fef2f2 35%, #fffbeb 70%, #fdf2e9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1c1917;
      text-align: center;
    }
    .container {
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 12px 36px rgba(153, 27, 27, 0.08), 0 2px 10px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(244, 63, 94, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .glow-aura {
      position: absolute;
      top: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(245, 158, 11, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseAura 3s ease-in-out infinite;
    }
    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .icon-wrapper {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #f59e0b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(185, 28, 28, 0.25);
      position: relative;
      z-index: 1;
    }
    .icon-inner {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #991b1b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title::before, .brand-title::after {
      content: "";
      width: 16px;
      height: 1px;
      background: #fca5a5;
    }
    .main-title {
      font-size: 22px;
      font-weight: 800;
      color: #1c1917;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .subtitle {
      font-size: 14px;
      color: #78716c;
      line-height: 1.55;
      margin-bottom: 28px;
      padding: 0 8px;
    }
    .btn-retry {
      width: 100%;
      background: linear-gradient(135deg, #991b1b 0%, #b91c1c 100%);
      color: #ffffff;
      border: none;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(153, 27, 27, 0.3);
      transition: all 0.2s ease;
      outline: none;
    }
    .btn-retry:active {
      transform: scale(0.98);
      background: #7f1d1d;
    }
    .btn-retry:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      margin-top: 18px;
      font-size: 12px;
      color: #a8a29e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online {
      background: #22c55e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow-aura"></div>
    
    <div class="icon-wrapper">
      <div class="icon-inner">
        <!-- Spiritual Shiva Baba Radiant Point of Light & WiFi Off Emblem -->
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <div class="brand-title">Connect GOD</div>
    <h1 class="main-title">No Internet Connection</h1>
    <p class="subtitle">Please check your Wi-Fi or mobile network and try again. Om Shanti.</p>

    <button id="retryBtn" class="btn-retry" onclick="handleRetry()">
      <span id="btnText">Retry</span>
      <div id="spinner" class="spinner"></div>
    </button>

    <div class="status-text">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusMessage">Waiting for network...</span>
    </div>
  </div>

  <script>
    var REMOTE_URL = "https://app.bkkozhikode.com";
    var isRetrying = false;

    function handleRetry() {
      if (isRetrying) return;
      isRetrying = true;

      var btnText = document.getElementById("btnText");
      var spinner = document.getElementById("spinner");
      var retryBtn = document.getElementById("retryBtn");
      var statusMsg = document.getElementById("statusMessage");

      btnText.textContent = "Connecting...";
      spinner.style.display = "block";
      retryBtn.disabled = true;
      statusMsg.textContent = "Checking connection...";

      // If Android native host interface is registered, call it
      if (window.AndroidHost && typeof window.AndroidHost.reload === "function") {
        window.AndroidHost.reload();
        return;
      }

      // Navigate WebView directly to the remote Vercel live URL
      setTimeout(function() {
        window.location.href = REMOTE_URL;
      }, 400);

      // Re-enable button after timeout in case navigation is blocked
      setTimeout(function() {
        isRetrying = false;
        btnText.textContent = "Retry";
        spinner.style.display = "none";
        retryBtn.disabled = false;
        statusMsg.textContent = "Still offline. Please check connection.";
      }, 7000);
    }

    // Auto-retry when internet connection is restored
    window.addEventListener("online", function() {
      var dot = document.getElementById("statusDot");
      var statusMsg = document.getElementById("statusMessage");
      if (dot) dot.classList.add("online");
      if (statusMsg) statusMsg.textContent = "Internet connection restored! Loading...";
      setTimeout(handleRetry, 600);
    });

    window.addEventListener("offline", function() {
      var dot = document.getElementById("statusDot");
      var statusMsg = document.getElementById("statusMessage");
      if (dot) dot.classList.remove("online");
      if (statusMsg) statusMsg.textContent = "No network connection.";
    });
  </script>
</body>
</html>
